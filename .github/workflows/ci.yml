name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Runs third-party code (npm install scripts, Astro), so it only gets a
  # read-only token and does not keep it in the git config.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: |
            dist
            wrangler.jsonc
          include-hidden-files: true
          retention-days: 1

  # Cloudflare Workers Builds watches the deploy branch and only runs
  # `wrangler deploy` on it, so nothing reaches production unless build passed.
  # No npm here: this job only moves files and pushes.
  publish:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: ${{ runner.temp }}/site
      - name: Publish build to the deploy branch
        run: |
          site="$RUNNER_TEMP/site"
          out="$RUNNER_TEMP/deploy"
          if git ls-remote --exit-code --heads origin deploy > /dev/null; then
            git fetch --depth 1 origin deploy
            git worktree add --detach "$out" FETCH_HEAD
          else
            git worktree add --detach "$out"
            git -C "$out" checkout --orphan deploy
          fi
          cd "$out"
          git rm -rqf --ignore-unmatch .
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R "$site/dist" dist
          cp "$site/wrangler.jsonc" wrangler.jsonc
          echo "Build output generated by CI from main. Do not edit; push to main instead." > README.md
          git add -A
          if git diff --cached --quiet; then
            echo "Build output unchanged; nothing to deploy."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "Deploy main@${GITHUB_SHA::7}"
          # Push from the main checkout, which holds the credentials.
          git -C "$GITHUB_WORKSPACE" push origin "$(git rev-parse HEAD)":refs/heads/deploy
